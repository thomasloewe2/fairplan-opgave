name: Bootstrap frontend lockfile (one-time)

on:
  push:
    branches:
      - feature/frontend
    paths:
      - '.github/workflows/bootstrap-frontend.yml'
permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): refresh npm lockfile with TanStack Table"
            git push origin HEAD:feature/frontend
          fi
