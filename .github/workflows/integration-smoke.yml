name: SQL Server integration smoke (one-time)

on:
  push:
    branches:
      - feature/backend-persistence
    paths:
      - '.github/workflows/integration-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'TemporaryStrongPassw0rd!'
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1,1433;Database=FairPlanCi;User Id=sa;Password=TemporaryStrongPassw0rd!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install dotnet-ef and build backend
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.14
          dotnet restore backend/backend.sln
          dotnet build backend/backend.sln --no-restore --configuration Release
      - name: Apply migration to actual SQL Server
        run: |
          for attempt in $(seq 1 24); do
            if ASPNETCORE_ENVIRONMENT=Production dotnet ef database update \
                --project backend/src/Infrastructure/Infrastructure.csproj \
                --startup-project backend/src/WebAPI/WebAPI.csproj \
                --context VagtplanDbContext \
                --no-build --configuration Release; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Start API in Development and verify seeded HTTP endpoints
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run \
            --no-build --configuration Release --no-launch-profile \
            --project backend/src/WebAPI/WebAPI.csproj \
            --urls http://127.0.0.1:5166 >/tmp/fairplan-api.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5166/api/periods >/tmp/periods.json; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/fairplan-api.log; exit 1; fi
          jq -e 'length == 2' /tmp/periods.json
          curl -fsS 'http://127.0.0.1:5166/api/personnel?periodId=40000000-0000-0000-0000-000000000001' \
            | jq -e 'length == 2'
          code=$(curl -s -o /tmp/conflict.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Overlap","startDate":"2026-11-30","endDate":"2026-12-05"}' \
            http://127.0.0.1:5166/api/periods)
          test "$code" = 409 || { cat /tmp/conflict.json; exit 1; }
          code=$(curl -s -o /tmp/adjacent.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"January","startDate":"2027-01-01","endDate":"2027-01-31"}' \
            http://127.0.0.1:5166/api/periods)
          test "$code" = 201 || { cat /tmp/adjacent.json; exit 1; }
          code=$(curl -s -o /tmp/deletion.json -w '%{http_code}' -X DELETE \
            http://127.0.0.1:5166/api/users/30000000-0000-0000-0000-000000000001)
          test "$code" = 409 || { cat /tmp/deletion.json; exit 1; }
          echo 'SQL migration, development seeding and API smoke checks passed.'
